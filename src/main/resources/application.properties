spring.application.name=banking-system

# MongoDB connection comes from the MONGODB_URI environment variable.
# The fallback is a plain local MongoDB (no credentials) so the project never contains secrets.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/banking}

# Needed so @Indexed(unique = true) on User.email is really created in MongoDB.
spring.data.mongodb.auto-index-creation=true

# JWT signing key, read from the JWT_SECRET environment variable.
# Must be a Base64-encoded value that decodes to at least 32 bytes (256 bits) for HS256.
# Generate one locally with:  openssl rand -base64 32
# The empty default below lets the app start far enough to give a clear error message
# (JwtService checks this itself) instead of a raw "unresolved placeholder" failure.
jwt.secret=${JWT_SECRET:}

# How long an issued token stays valid, in milliseconds. Default: 1 hour.
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}