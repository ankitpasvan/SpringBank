spring.application.name=banking-system

# MongoDB connection comes from the MONGODB_URI environment variable.
# The fallback is a plain local MongoDB (no credentials) so the project never contains secrets.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/banking}

# Needed so @Indexed(unique = true) on User.email is really created in MongoDB.
spring.data.mongodb.auto-index-creation=true