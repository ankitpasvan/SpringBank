spring.application.name=banking-system

# PostgreSQL connection. All secrets come from environment variables - never commit real values.
# Local default: a database named "banking" on localhost. Create it once with:
#   createdb -U postgres banking   (or: CREATE DATABASE banking; in psql)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/banking}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate schema handling. "update" is convenient for local development.
# For production, use "validate" and manage the schema with a migration tool instead.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Store and read timestamps in UTC so Instant fields behave the same everywhere.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT signing key, read from the JWT_SECRET environment variable.
# Must be a Base64-encoded value that decodes to at least 32 bytes (256 bits) for HS256.
# Generate one locally with:  openssl rand -base64 32
# The empty default below lets the app start far enough to give a clear error message
# (JwtService checks this itself) instead of a raw "unresolved placeholder" failure.
jwt.secret=${JWT_SECRET:}

# How long an issued token stays valid, in milliseconds. Default: 1 hour.
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
