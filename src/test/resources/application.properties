# Test-only JPA settings. The datasource URL is deliberately NOT set here: with H2 on the
# test classpath, Spring Boot auto-configures an embedded H2 database with a UNIQUE generated
# name per test application context, so parallel/cached test contexts never share (or clash
# on) one in-memory database. @DataJpaTest tests additionally get Boot's test-database
# replacement automatically.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
